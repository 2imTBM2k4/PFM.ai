name: Build iOS IPA (via EAS)

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'EAS Build Profile (preview sinh file .ipa cài thử nghiệm)'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - development
          - production

permissions:
  contents: read

jobs:
  build-eas:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup EAS CLI
        run: npm install -g eas-cli

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run EAS Build
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          eas build --platform ios --profile ${{ inputs.profile }} --non-interactive
