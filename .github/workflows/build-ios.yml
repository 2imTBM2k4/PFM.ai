name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Kiểu build: "unsigned" (cài qua Sideloadly/AltStore) hoặc "signed" (nếu có tài khoản Apple Developer)'
        required: true
        default: 'unsigned'
        type: choice
        options:
          - unsigned
          - signed
      proxy_url:
        description: 'EXPO_PUBLIC_PROXY_URL'
        required: false
        default: 'https://wolf-lapel-founding.ngrok-free.dev'
        type: string
      export_method:
        description: 'Export method nếu chọn signed (ad-hoc / development / app-store)'
        required: false
        default: 'ad-hoc'
        type: choice
        options:
          - ad-hoc
          - development
          - app-store

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    env:
      # Compile Expo modules together to avoid incompatible precompiled Swift symbols.
      EXPO_USE_PRECOMPILED_MODULES: "0"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write mobile .env
        run: |
          mkdir -p apps/mobile
          cat << 'EOF' > apps/mobile/.env
          EXPO_PUBLIC_PROXY_URL=${{ inputs.proxy_url }}
          EOF

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.0.app || sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Run Expo Prebuild (Generate native iOS project)
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --clean

      - name: Setup Apple Signing (Only for signed mode)
        if: ${{ inputs.build_type == 'signed' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 12)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          CERT_PATH=$RUNNER_TEMP/certificate.p12
          echo "${{ secrets.APPLE_CERTIFICATE_BASE64 }}" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision
          echo "Apple Keychain & Provisioning Profile configured."

      - name: Build and Package IPA
        run: |
          cd apps/mobile/ios
          WORKSPACE=$(find . -maxdepth 1 -name "*.xcworkspace" | head -n 1)
          SCHEME="PFMai"
          mkdir -p ../build

          echo "Selected Workspace: $WORKSPACE"
          echo "Selected Scheme: $SCHEME"

          if [ "${{ inputs.build_type }}" = "unsigned" ]; then
            echo "==> Building Unsigned Archive..."
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/PFMai.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY=""

            echo "==> Packaging into IPA..."
            mkdir -p ../build/Payload
            cp -R ../build/PFMai.xcarchive/Products/Applications/*.app ../build/Payload/
            cd ../build
            zip -qr PFMai-unsigned.ipa Payload
            echo "Generated: apps/mobile/build/PFMai-unsigned.ipa"
          else
            echo "==> Building Signed Archive..."
            xcodebuild archive \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -archivePath ../build/PFMai.xcarchive

            cat << EOF > ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>${{ inputs.export_method }}</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>stripSwiftSymbols</key>
              <true/>
          </dict>
          </plist>
          EOF

            echo "==> Exporting Signed IPA..."
            xcodebuild -exportArchive \
              -archivePath ../build/PFMai.xcarchive \
              -exportPath ../build \
              -exportOptionsPlist ExportOptions.plist
          fi

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PFMai-${{ inputs.build_type }}-build-${{ github.run_number }}
          path: apps/mobile/build/*.ipa
          if-no-files-found: error
          retention-days: 14
